<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Navegación - SICEN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 28px;
        }

        svg {
            width: 100%;
            height: auto;
        }

        /* Estilos de cajas */
        .box-inicio {
            fill: #f0f0f0;
            stroke: #333;
            stroke-width: 2;
            rx: 10;
        }

        .box-usuario {
            fill: #3b82f6;
            stroke: #333;
            stroke-width: 2;
            rx: 8;
        }

        .box-pagina {
            fill: #3b82f6;
            stroke: #333;
            stroke-width: 2;
            rx: 8;
        }

        .box-formulario {
            fill: #7dd3fc;
            stroke: #333;
            stroke-width: 2;
            rx: 6;
        }

        /* Estilos de texto */
        .text-inicio {
            font-size: 16px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .text-usuario {
            font-size: 14px;
            font-weight: bold;
            fill: white;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .text-pagina {
            font-size: 13px;
            font-weight: bold;
            fill: white;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .text-formulario {
            font-size: 12px;
            fill: #333;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        /* Líneas de conexión */
        .linea {
            stroke: #333;
            stroke-width: 2;
            fill: none;
        }

        .flecha {
            fill: #333;
        }

        .titulo-seccion {
            font-size: 18px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diagrama de Navegación - SICEN</h1>

        <svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
            <!-- PÁGINA DE INICIO -->
            <rect x="450" y="20" width="300" height="80" class="box-inicio"/>
            <text x="600" y="60" class="text-inicio">Página de Inicio</text>

            <!-- LÍNEAS PRINCIPALES DESDE INICIO -->
            <line x1="550" y1="100" x2="300" y2="160" class="linea"/>
            <line x1="650" y1="100" x2="900" y2="160" class="linea"/>

            <!-- USUARIO 1: DIRECTOR -->
            <rect x="100" y="160" width="400" height="80" class="box-usuario"/>
            <text x="300" y="205" class="text-usuario">Director de Centro Educativo</text>

            <!-- LÍNEA HACIA DASHBOARD DIRECTOR -->
            <line x1="300" y1="240" x2="200" y2="300" class="linea"/>
            <line x1="300" y1="240" x2="400" y2="300" class="linea"/>

            <!-- PÁGINAS DIRECTOR -->
            <rect x="50" y="300" width="150" height="70" class="box-pagina"/>
            <text x="125" y="340" class="text-pagina">Dashboard</text>

            <rect x="250" y="300" width="150" height="70" class="box-pagina"/>
            <text x="325" y="340" class="text-pagina">Formularios</text>

            <!-- LÍNEA HACIA FORMULARIO DIRECTOR -->
            <line x1="325" y1="370" x2="325" y2="420" class="linea"/>

            <rect x="200" y="420" width="250" height="70" class="box-formulario"/>
            <text x="325" y="450" class="text-formulario">Completar Formulario Censo</text>
            <text x="325" y="470" class="text-formulario">Ver estado de envíos</text>

            <!-- USUARIO 2: ADMINISTRADOR -->
            <rect x="700" y="160" width="400" height="80" class="box-usuario"/>
            <text x="900" y="205" class="text-usuario">Administrador del MEP</text>

            <!-- LÍNEA HACIA DASHBOARD ADMIN -->
            <line x1="800" y1="240" x2="700" y2="300" class="linea"/>
            <line x1="1000" y1="240" x2="1100" y2="300" class="linea"/>

            <!-- PÁGINAS ADMIN -->
            <rect x="550" y="300" width="150" height="70" class="box-pagina"/>
            <text x="625" y="340" class="text-pagina">Dashboard</text>

            <rect x="1000" y="300" width="150" height="70" class="box-pagina"/>
            <text x="1075" y="340" class="text-pagina">Validar Datos</text>

            <!-- LÍNEA HACIA TAREAS ADMIN 1 -->
            <line x1="625" y1="370" x2="550" y2="420" class="linea"/>
            <line x1="625" y1="370" x2="750" y2="420" class="linea"/>

            <rect x="400" y="420" width="180" height="70" class="box-formulario"/>
            <text x="490" y="450" class="text-formulario">Crear Formularios</text>
            <text x="490" y="470" class="text-formulario">Gestionar Censos</text>

            <rect x="650" y="420" width="180" height="70" class="box-formulario"/>
            <text x="740" y="450" class="text-formulario">Revisar Datos</text>
            <text x="740" y="470" class="text-formulario">Aceptar/Devolver</text>

            <!-- LÍNEA HACIA TAREAS ADMIN 2 -->
            <line x1="1075" y1="370" x2="950" y2="420" class="linea"/>
            <line x1="1075" y1="370" x2="1150" y2="420" class="linea"/>

            <rect x="850" y="420" width="180" height="70" class="box-formulario"/>
            <text x="940" y="450" class="text-formulario">Ver Reportes</text>
            <text x="940" y="470" class="text-formulario">Estadísticas</text>

            <rect x="1050" y="420" width="180" height="70" class="box-formulario"/>
            <text x="1140" y="450" class="text-formulario">Enviar Alertas</text>
            <text x="1140" y="470" class="text-formulario">Notificaciones</text>

            <!-- LEYENDA -->
            <g transform="translate(100, 700)">
                <text x="0" y="0" class="titulo-seccion" style="text-anchor: start; font-size: 16px; font-weight: bold;">REFERENCIAS:</text>

                <rect x="0" y="30" width="40" height="30" class="box-inicio"/>
                <text x="60" y="50" class="text-inicio" style="text-anchor: start; font-size: 13px;">Página Principal</text>

                <rect x="0" y="75" width="40" height="30" class="box-usuario"/>
                <text x="60" y="95" class="text-inicio" style="text-anchor: start; font-size: 13px;">Tipo de Usuario</text>

                <rect x="0" y="120" width="40" height="30" class="box-pagina"/>
                <text x="60" y="140" class="text-inicio" style="text-anchor: start; font-size: 13px;">Secciones</text>

                <rect x="0" y="165" width="40" height="30" class="box-formulario"/>
                <text x="60" y="185" class="text-formulario" style="text-anchor: start; font-size: 13px;">Funcionalidades</text>
            </g>
        </svg>
    </div>
</body>
</html>
