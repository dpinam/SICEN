<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SICEN - Panel principal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">SICEN</span>
    <div class="user-info">
      <span id="user-name">Cargando...</span>
      <span class="badge" id="user-role"></span>
      <button type="button" class="btn btn-secondary" id="logout-btn" style="width:auto; padding:6px 14px;">
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="card">
      <h2>Bienvenido(a) a SICEN</h2>
      <p class="text-aux">
        Sistema de Gestión de Censos Escolares del Ministerio de Educación Pública.
      </p>
      <p id="dashboard-status">Verificando sesión...</p>
    </div>
  </main>

  <script src="js/session.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
