<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SICEN - Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="login-form" novalidate>
      <div class="login-logo" aria-hidden="true">SICEN</div>
      <h1>Iniciar sesión</h1>
      <p class="login-subtitle">Sistema de Gestión de Censos Escolares</p>

      <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Iniciar sesión</button>

      <div class="login-links">
        <a href="#" id="forgot-link">¿Olvidó su contraseña?</a>
      </div>
    </form>
  </main>

  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
